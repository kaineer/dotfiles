---
- hosts: localhost
  connection: local
  become: true
  environment:
    PRESERVED_USER: "{{ lookup('ansible.builtin.env', 'USER') }}"

  tasks:
    # --- variables (jsonnet → vars.json; optional host override via -e @vars/user/<host>.yml)
    #
    - include_vars: "{{ vars_file | default(playbook_dir + '/vars.json') }}"

    # --- tasks (jsonnet → tasks.json)
    #
    - include_tasks: "{{ tasks_file | default(playbook_dir + '/tasks.json') }}"
