---
- name: Install missing packages
  package:
    name: "{{ system_packages }}"
    state: "present"

- name: Install gui packages
  package:
    name: "{{ gui_packages }}"
    state: "present"
  when: "ansible_nodename in gui_workstations"

- name: Install awesome packages
  package:
    name: "{{ awesome_packages }}"
    state: "present"
  when: "ansible_nodename in awesome_workstations"

- name: Remove unnecessary packages
  apt:
    name: "{{ obsolete_packages }}"
    state: "absent"
    autoremove: true

- name: Create bin directory
  ansible.builtin.file:
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    path: "/home/{{ user.name }}/bin"
    state: "directory"

# Paths use playbook_dir: after include_tasks of absolute tasks.json,
# Ansible's basedir shifts and bare ./... resolves under ansible/.
- include_tasks: "{{ playbook_dir }}/tasks/wezterm.yml"
- include_tasks: "{{ playbook_dir }}/tasks/ghostty.yml"
# Migrated cli (+ gnome) → jsonnet → ansible/tasks.json
- include_tasks: "{{ tasks_file | default(playbook_dir + '/tasks.json') }}"
- include_tasks: "{{ playbook_dir }}/tasks/rust/repo.yml"
- include_tasks: "{{ playbook_dir }}/tasks/rust/cli.yml"

- include_tasks: "{{ playbook_dir }}/tasks/media/mocp.yml"
- include_tasks: "{{ playbook_dir }}/tasks/media/rmpc.yml"
- include_tasks: "{{ playbook_dir }}/tasks/media/pinta.yml"
- include_tasks: "{{ playbook_dir }}/tasks/browsers/brave.yml"

- include_tasks: "{{ playbook_dir }}/tasks/gui/eog.yml"
- include_tasks: "{{ playbook_dir }}/tasks/gui/obsidian.yml"
- include_tasks: "{{ playbook_dir }}/tasks/gui/telegram.yml"
- include_tasks: "{{ playbook_dir }}/tasks/gui/zathura.yml"
- include_tasks: "{{ playbook_dir }}/tasks/gui/zed.yml"
