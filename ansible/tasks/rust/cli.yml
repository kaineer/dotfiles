---
# Install rust CLI tools from ~/git/config/cli-rs into ~/.cargo/bin.
# Any leftover ~/bin/<name> symlink (from the old bash scripts install)
# is removed so it does not shadow the cargo binary.

- name: Install rust CLIs from cli-rs via cargo
  become_user: "{{ user.name }}"
  environment:
    PATH: "/home/{{ user.name }}/.cargo/bin:{{ ansible_env.PATH }}"
    HOME: "/home/{{ user.name }}"
    CARGO_HOME: "/home/{{ user.name }}/.cargo"
    RUSTUP_HOME: "/home/{{ user.name }}/.rustup"
  ansible.builtin.command:
    cmd: >-
      cargo install --path
      /home/{{ user.name }}/git/config/cli-rs/{{ item }}
      --force
  loop: "{{ rust_scripts }}"
  changed_when: true

- name: Stat leftover ~/bin entries for rust CLIs
  ansible.builtin.stat:
    path: "/home/{{ user.name }}/bin/{{ item }}"
  loop: "{{ rust_scripts }}"
  register: rust_scripts_bin_stats

- name: Remove ~/bin symlinks that shadow cargo installs
  ansible.builtin.file:
    path: "/home/{{ user.name }}/bin/{{ item.item }}"
    state: absent
  loop: "{{ rust_scripts_bin_stats.results }}"
  when:
    - item.stat.exists | default(false)
    - item.stat.islnk | default(false)
