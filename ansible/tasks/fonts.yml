#       - "FiraCode/Regular/FiraCodeNerdFont-Regular.ttf"
#       - "FiraCode/Light/FiraCodeNerdFont-Light.ttf"

- name: Prepare folder for fira code fonts
  file:
    path: "/home/{{ user.name }}/.local/share/fonts/FiraCode"
    state: "directory"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "755"

- name: Install fira nerd
  ansible.builtin.unarchive:
    src: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.tar.xz"
    dest: "/home/{{ user.name }}/.local/share/fonts/FiraCode"
    remote_src: true
    creates: "/home/{{ user.name }}/.local/share/fonts/FiraCode/FiraCodeNerdFont-Regular.ttf"
- name: Prepare fonts cache
  ansible.builtin.command: fc-cache -f
  changed_when: false
