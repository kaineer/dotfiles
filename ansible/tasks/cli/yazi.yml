---
# Yazi settings
#   * yazi.toml / keymap.toml / theme.toml
#   * plugins → ~/.config/yazi/plugins/*.yazi
#   * binaries: yazi + ya в ~/.cargo/bin (PATH уже включает)
#
# @link: https://yazi-rs.github.io/docs/installation
# @link: https://crates.io/crates/yazi-build

- name: Mkdir for yazi config
  file:
    path: "/home/{{ user.name }}/.config/yazi"
    recurse: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    state: directory
    mode: "755"

- name: Link yazi config files
  file:
    src: "{{ playbook_dir }}/files/yazi/{{ item }}"
    dest: "/home/{{ user.name }}/.config/yazi/{{ item }}"
    state: "link"
    force: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "644"
  with_items:
    - yazi.toml
    - keymap.toml
    - theme.toml

- name: Mkdir for yazi plugins
  file:
    path: "/home/{{ user.name }}/.config/yazi/plugins"
    recurse: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    state: directory
    mode: "755"

# file(state=link, force=true) не заменяет каталоги — отсюда
# "refusing to convert it", если on-enter.yazi уже обычная папка.
# Удаляем dest только когда это не нужный симлинк.
- name: Stat yazi plugins
  ansible.builtin.stat:
    path: "/home/{{ user.name }}/.config/yazi/plugins/{{ item }}"
  loop:
    - on-enter.yazi
  register: yazi_plugin_stats

- name: Remove yazi plugin dest unless already linked
  ansible.builtin.file:
    path: "/home/{{ user.name }}/.config/yazi/plugins/{{ item.item }}"
    state: absent
  loop: "{{ yazi_plugin_stats.results }}"
  when:
    - item.stat.exists | default(false)
    - not (
        (item.stat.islnk | default(false))
        and item.stat.lnk_source == (playbook_dir ~ '/files/yazi/plugins/' ~ item.item)
      )

- name: Link yazi plugins
  file:
    src: "{{ playbook_dir }}/files/yazi/plugins/{{ item }}"
    dest: "/home/{{ user.name }}/.config/yazi/plugins/{{ item }}"
    state: "link"
    force: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
  loop:
    - on-enter.yazi

- name: Install yazi via cargo
  become_user: "{{ user.name }}"
  environment:
    PATH: "/home/{{ user.name }}/.cargo/bin:{{ ansible_env.PATH }}"
    HOME: "/home/{{ user.name }}"
    CARGO_HOME: "/home/{{ user.name }}/.cargo"
    RUSTUP_HOME: "/home/{{ user.name }}/.rustup"
  community.general.cargo:
    name:
      - yazi-build

- name: Remove stale yazi binaries from ~/bin
  file:
    path: "/home/{{ user.name }}/bin/{{ item }}"
    state: absent
  with_items:
    - yazi
    - ya
