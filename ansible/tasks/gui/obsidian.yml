# https://github.com/obsidianmd/obsidian-releases/releases/download/v1.8.9/Obsidian-1.8.9.AppImage
- name: Check if obsidian is installed
  stat:
    path: "/home/{{user.name}}/bin/obsidian"
  register: "obsidian_link"

- name: Create appimages dir
  file:
    path: "/home/{{ user.name }}/bin/appimages"
    state: "directory"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "755"

- name: Download obsidian appimage
  vars:
    obsidian_version: "1.14.4"
    obsidian_repo: "https://github.com/obsidianmd/obsidian-releases"
  when: "not obsidian_link.stat.exists"
  get_url:
    url: "{{obsidian_repo}}/releases/download/v{{obsidian_version}}/Obsidian-{{obsidian_version}}.AppImage"
    dest: "/home/{{user.name}}/bin/appimages/Obsidian-{{obsidian_version}}.AppImage"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "755"

- name: "Link to obsidian appimage"
  when: "not obsidian_link.stat.exists"
  vars:
    obsidian_version: "1.14.4"
  file:
    src: "/home/{{user.name}}/bin/appimages/Obsidian-{{obsidian_version}}.AppImage"
    dest: "/home/{{user.name}}/bin/obsidian"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    state: "link"

- name: Create icons dir for obsidian
  file:
    path: "/home/{{ user.name }}/.local/share/icons/hicolor/scalable/apps"
    state: "directory"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "755"

- name: Install obsidian icon
  copy:
    src: "{{ playbook_dir }}/files/obsidian/obsidian.svg"
    dest: "/home/{{ user.name }}/.local/share/icons/hicolor/scalable/apps/obsidian.svg"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "644"

# Active icon themes already ship apps/scalable/obsidian.svg and win over hicolor
# for Icon=obsidian lookups — override them with our icon.
- name: Find theme obsidian icons to override
  find:
    paths:
      - "/home/{{ user.name }}/.icons"
      - "/home/{{ user.name }}/.local/share/icons"
    patterns:
      - "obsidian.svg"
      - "md.obsidian.Obsidian.svg"
    file_type: file
  register: "obsidian_theme_icons"

- name: Override theme obsidian icons
  copy:
    src: "{{ playbook_dir }}/files/obsidian/obsidian.svg"
    dest: "{{ item.path }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "644"
  loop: "{{ obsidian_theme_icons.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Create applications dir
  file:
    path: "/home/{{ user.name }}/.local/share/applications"
    state: "directory"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "755"

- name: Remove legacy obsidian desktop entry
  file:
    path: "/home/{{ user.name }}/.local/share/applications/obsidian.desktop"
    state: "absent"

- name: Install obsidian desktop entry
  copy:
    dest: "/home/{{ user.name }}/.local/share/applications/md.obsidian.Obsidian.desktop"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "644"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Obsidian
      Comment=Markdown knowledge base
      Exec=/home/{{ user.name }}/bin/obsidian %U
      Icon=/home/{{ user.name }}/.local/share/icons/hicolor/scalable/apps/obsidian.svg
      Terminal=false
      Categories=Office;
      MimeType=x-scheme-handler/obsidian;
      StartupWMClass=md.obsidian.Obsidian

- name: Refresh icon and desktop caches
  become_user: "{{ user.name }}"
  shell: |
    gtk-update-icon-cache -f "/home/{{ user.name }}/.local/share/icons/hicolor" 2>/dev/null || true
    update-desktop-database "/home/{{ user.name }}/.local/share/applications" 2>/dev/null || true
  changed_when: false
