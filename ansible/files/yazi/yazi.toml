[preview]
image_adapter = "iip"

[opener]
play-video-cli = [
  { run = "mplayer -noborder %s", orphan = true, desc = "Play video with mplayer" },
]
play-audio-cli = [
  { run = "mplayer %s", desc = "Play audio with mplayer" },
]
jless-view = [
  { run = "/home/kaineer/bin/jless %s" },
]
install-rust = [
  { run = 'cd %d1 && cargo install --path=. && ya emit notify:push " Installation complete " "cargo" --timeout=3 --level=info', block = true, desc = "Compile and install" },
]
test-rust = [
  { run = 'cd %d1 && cargo install --path=. && ya emit notify:push " Tests successful " "cargo" --timeout=3 --level=info || ya emit notify:push " Some failures " "cargo" --timeout=5 --level=error', block = true, desc = "Run tests" },
]
neovim-edit = [
  { run = "nvim %s", block = true },
]
image-view = [
  { run = "eog -f %s" },
]
markdown-view = [
  { run = "vmd -f %s" },
]
xdg-open = [
  { run = "open %s" },
]

[open]
prepend_rules = [
  { mime = "image/*", use = "image-view" },
  { mime = "video/*", use = "play-video-cli" },
  { mime = "audio/*", use = "play-audio-cli" },
  { mime = "application/json", use = ["jless-view", "neovim-edit"] },
  { url = "**/Cargo.toml", use = ["install-rust", "test-rust"] },
  { url = "*.md", use = ["markdown-view", "neovim-edit"] },
  { url = "*.html", use = ["neovim-edit", "xdg-open" ] },
]

[mgr]

sort_by = "mtime"
show_hidden = true
show_symlink = true
